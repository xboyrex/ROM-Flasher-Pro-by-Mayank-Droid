<text x="84" y="176" font-family="Arial,Helvetica,sans-serif" font-size="59" font-weight="800" letter-spacing="-2" fill="#f5f7ff">ROM FLASHER</text>
<text x="84" y="240" font-family="Arial,Helvetica,sans-serif" font-size="59" font-weight="800" letter-spacing="-2" fill="url(#neon)">PRO</text>
<text x="88" y="282" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="2" fill="#a4b2cc">CONTROL YOUR WORKFLOW. VERIFY EVERY PACKAGE.</text>
